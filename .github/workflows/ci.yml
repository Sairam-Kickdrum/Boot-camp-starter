name: CI

on:
  push:
    branches: [main, "feat/**", "participant/**", "solutions/**"]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd infra/cdk && npm ci
      - run: npm run cdk:synth
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-test, build]
    # Requires these secrets set on the repo (or fork):
    #   CI_AWS_ACCESS_KEY_ID       — IAM key with cognito-idp permissions
    #   CI_AWS_SECRET_ACCESS_KEY   — matching secret
    #   CI_COGNITO_USER_POOL_ID    — dedicated CI User Pool (e.g. us-east-1_CIxxxxxxx)
    #   CI_COGNITO_CLIENT_ID       — App Client ID for that pool
    # See docs/boot-camp/cognito-setup.md for how to create the User Pool.
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: bootcamp
          POSTGRES_PASSWORD: bootcamp
          POSTGRES_DB: bootcamp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bootcamp:bootcamp@localhost:5432/bootcamp
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
      COGNITO_USER_POOL_ID: ${{ secrets.CI_COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ secrets.CI_COGNITO_CLIENT_ID }}
      SESSION_SECRET: ci-test-secret
      NODE_ENV: test
      VITE_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 1. Apply schema migrations
      - run: npm run db:migrate

      # 2. Seed rooms and users (creates Postgres rows, no passwords)
      - run: npm run db:seed

      # 3. Create Cognito users and link their sub IDs to Postgres
      - run: bash scripts/seed-cognito.sh

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start API and web servers
        run: npm run dev &

      - name: Wait for servers to be ready
        run: npx wait-on http://localhost:3000/health http://localhost:5173 --timeout 60000

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
